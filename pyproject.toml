[project]
name = "starlette-authlib"
version = "0.3.22"
description = "A drop-in replacement for Starlette session middleware, using authlib's jwt"
authors = [{ name = "Alessandro Ogier", email = "alessandro.ogier@gmail.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
dependencies = ["authlib<1.9", "starlette<1.8"]

[project.urls]
Repository = "https://github.com/aogier/starlette-authlib"

[dependency-groups]
dev = [
  "codecov>=2.1.12,<3",
  "mypy>=2",
  "pre-commit>=4",
  "isort>=9",
  "httpx>=0.28.1,<0.29",
  "types-authlib>=1.8.0.20260911",
  "pre-commit-hooks>=6.0.0",
  "black>=26.5.1",
  "autoflake>=2.4.0",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "requests>=2.34.2",
]

[tool.uv]
default-groups = "all"


[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
files = ["src"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
show_error_codes = true
warn_unused_ignores = true

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
line_length = 88

[tool.autoflake]
in-place = true
recursive = true
